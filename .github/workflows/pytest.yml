name: pytest

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # ezdwg pinned 0.16.0 (D13 / D13-2); unpinned installs pull 0.17.x and fail
          # tests/test_skill14_build.py::test_nested_insert_raw_not_todxf.
          pip install pytest shapely numpy scipy jsonschema lxml ezdxf pypdfium2 Pillow \
            openpyxl pdfplumber reportlab python-docx 'ezdwg==0.16.0' PyYAML
      - name: Full suite via check_suite (expect recorded count)
        run: |
          # 719 = 718 + D1 synthetic (NMAR key-plan G-KEYP vs UTM envelope)
          # (708 + B1–B3: +1 C4 sign + 8 EPSG forms + 1 normalize_crs; 5 real env-gated).
          # Cursor without LDIP_SKILL9_* / LDIP_REVIEW_ROOT: real gates skipped.
          python tools/check_suite.py --expect 719 --tests tests
      - name: No project data in Git (name + content fingerprints)
        run: python tools/check_no_data.py --all
