name: pytest

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest shapely numpy scipy jsonschema lxml ezdxf pypdfium2 Pillow
      - name: Run plugin / skill tests (no project data)
        run: |
          python -m pytest tests/test_revj_build.py tests/test_revj_real.py tests/test_phase_d_surfaces.py \
            tests/test_revg_build.py tests/test_road_presence.py tests/test_plugin_layout.py \
            tests/test_check_suite.py tests/test_d11_bash_lines.py -q --tb=line
      - name: No project data in Git
        run: python tools/check_no_data.py
