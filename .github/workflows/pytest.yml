name: pytest

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest shapely numpy scipy jsonschema lxml ezdxf pypdfium2 Pillow \
            openpyxl pdfplumber reportlab python-docx ezdwg PyYAML
      - name: Full suite via check_suite (expect recorded count)
        run: |
          # 670 = 659 on main @ 0972b5e + Amendment O-a skill 1
          # (+6 synthetic + 5 real env-gated skips in test_skill1_oa_*.py).
          # Claude main baseline: 618 passed / 41 skipped / 0 failed.
          # This environment on main: 617 passed / 42 skipped (one extra env skip).
          # Expect after O-a: 623 passed / 47 skipped / 0 failed (Cursor) or 624 / 46 (Claude).
          python tools/check_suite.py --expect 670 --tests tests
      - name: No project data in Git (name + content fingerprints)
        run: python tools/check_no_data.py --all
