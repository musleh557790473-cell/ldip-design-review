name: pytest

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # ezdwg pinned 0.16.0 (D13 / D13-2); unpinned installs pull 0.17.x and fail
          # tests/test_skill14_build.py::test_nested_insert_raw_not_todxf.
          pip install pytest shapely numpy scipy jsonschema lxml ezdxf pypdfium2 Pillow \
            openpyxl pdfplumber reportlab python-docx 'ezdwg==0.16.0' PyYAML
      - name: Full suite via check_suite (expect recorded count)
        run: |
          # 708 = 694 after v0.13.0 + skill 9 0.3.0 coordinates
          # (+9 synthetic T9-C* / unit + 5 real T9-R1…R5 env-gated).
          # Cursor without LDIP_REVIEW_ROOT: real gates skipped. Claude with scratch runs them.
          python tools/check_suite.py --expect 708 --tests tests
      - name: No project data in Git (name + content fingerprints)
        run: python tools/check_no_data.py --all
