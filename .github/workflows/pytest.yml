name: pytest

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # ezdwg pinned 0.16.0 (D13 / D13-2); unpinned installs pull 0.17.x and fail
          # tests/test_skill14_build.py::test_nested_insert_raw_not_todxf.
          pip install pytest shapely numpy scipy jsonschema lxml ezdxf pypdfium2 Pillow \
            openpyxl pdfplumber reportlab python-docx 'ezdwg==0.16.0' PyYAML
      - name: Full suite via check_suite (expect recorded count)
        run: |
          # 685 = 679 after PR #22 + G-Oa4 / DOa4
          # (+3 synthetic in test_skill1_goa4_build.py + 3 real env-gated in test_skill1_goa4_real.py).
          # Cursor without LibreDWG/scratch: 630 passed / 55 skipped.
          # Claude with LibreDWG + DWGs runs the DOa4 real extract counts (and prior J7 real tests).
          python tools/check_suite.py --expect 685 --tests tests
      - name: No project data in Git (name + content fingerprints)
        run: python tools/check_no_data.py --all
