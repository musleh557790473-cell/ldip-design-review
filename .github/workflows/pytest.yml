name: pytest

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest shapely numpy scipy jsonschema lxml ezdxf pypdfium2 Pillow \
            openpyxl pdfplumber reportlab python-docx ezdwg PyYAML
      - name: Full suite via check_suite (expect recorded count)
        run: |
          # 628 = 610 + skill 16 0.1.0 R1–R9 (14 synthetic + 3 real gated + 1 D11 SKILL.md).
          python tools/check_suite.py --expect 628 --tests tests
      - name: No project data in Git (name + content fingerprints)
        run: python tools/check_no_data.py --all
