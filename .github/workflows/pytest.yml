name: pytest

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # ezdwg pinned 0.16.0 (D13 / D13-2); unpinned installs pull 0.17.x and fail
          # tests/test_skill14_build.py::test_nested_insert_raw_not_todxf.
          pip install pytest shapely numpy scipy jsonschema lxml ezdxf pypdfium2 Pillow \
            openpyxl pdfplumber reportlab python-docx 'ezdwg==0.16.0' PyYAML
      - name: Full suite via check_suite (expect recorded count)
        run: |
          # 682 = 679 at cd06f85 (main after #22) + 3 skill14 0.1.1 C2 ER tests
          # (replaced test_c2_never_emits with 4 DO-5 tests → net +3).
          # Cursor without LibreDWG/scratch: synthetic pass; real skill1/14 skip.
          # Claude with LibreDWG + DWGs: runs env-gated real tests.
          python tools/check_suite.py --expect 682 --tests tests
      - name: No project data in Git (name + content fingerprints)
        run: python tools/check_no_data.py --all
