name: pytest

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest shapely numpy scipy jsonschema lxml ezdxf pypdfium2 Pillow \
            openpyxl pdfplumber reportlab python-docx ezdwg PyYAML
      - name: Full suite via check_suite (expect recorded count)
        run: |
          # 679 = 670 at b27aef8 + J1–J7 review fixes
          # (+4 synthetic in test_skill1_oa_build.py + 5 real env-gated in test_skill1_oa_real.py).
          # Cursor without LibreDWG/scratch: +4 pass, +5 skip → 627 passed / 52 skipped.
          # Claude with LibreDWG + DWGs: runs J7 real tests (chain QRWN/NRJS + cross-check ×3).
          python tools/check_suite.py --expect 679 --tests tests
      - name: No project data in Git (name + content fingerprints)
        run: python tools/check_no_data.py --all
